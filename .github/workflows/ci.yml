name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build e testes (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, testes unitários e de integração
        run: mvn -B verify
      - name: Relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-testes
          path: target/site/jacoco

  postgres:
    name: Testes de integração (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: margem_teste
          POSTGRES_USER: margem
          POSTGRES_PASSWORD: margem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U margem -d margem_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MARGEM_TESTE_DB_URL: jdbc:postgresql://localhost:5432/margem_teste
      MARGEM_TESTE_DB_USUARIO: margem
      MARGEM_TESTE_DB_SENHA: margem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes contra PostgreSQL de verdade
        run: mvn -B verify

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem
        run: docker build -t margem:ci .
